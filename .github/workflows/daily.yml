name: 매일 인스타 카드뉴스 발행

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제 업로드 없이 이미지·캡션만 확인"
        type: boolean
        default: false
      slug:
        description: "특정 원고를 지정해 발행 (비우면 큐의 다음 순서)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-daily
  cancel-in-progress: false

env:
  MAIN_BRANCH: main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: 의존성 설치
        run: |
          pip install --quiet playwright requests
          playwright install --with-deps chromium

      - name: 발행할 원고 선택
        id: pick
        run: |
          cd scripts
          if [ -n "${{ inputs.slug }}" ]; then
            SLUG="${{ inputs.slug }}"
          else
            SLUG=$(python -c "import postqueue; s=postqueue.next_slug(); print(s or '')")
          fi
          if [ -z "$SLUG" ]; then
            echo "::error::발행 대기 중인 원고가 없습니다. content/queue/ 를 채워주세요."
            exit 1
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "오늘 발행: $SLUG"

      - name: 중복 발행 방지 확인
        if: ${{ inputs.dry_run != true }}
        env:
          SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          cd scripts
          python - <<'PY'
          import os, sys, postqueue
          slug = os.environ["SLUG"]
          if slug in postqueue.load_state().get("posted", []):
              sys.exit(f"::error::{slug} 는 이미 발행된 원고입니다. 중복 발행을 막고 종료합니다.")
          PY

      - name: 원고 형식 검사
        run: cd scripts && python validate.py "${{ steps.pick.outputs.slug }}"

      - name: 카드 이미지 렌더링
        run: cd scripts && python render.py --slug "${{ steps.pick.outputs.slug }}"

      - name: 렌더 결과 업로드 (백업용)
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ steps.pick.outputs.slug }}
          path: out/${{ steps.pick.outputs.slug }}/*.jpg
          retention-days: 14

      - name: 이미지 커밋 & 푸시
        id: commit
        run: |
          git config user.name  "cardnews-bot"
          git config user.email "actions@github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "커밋할 이미지 변경 없음 (기존 커밋 재사용)"
          else
            git commit -m "render: ${{ steps.pick.outputs.slug }}"
          fi
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin "$MAIN_BRANCH" \
              && git rebase "origin/$MAIN_BRANCH" \
              && git push origin "HEAD:$MAIN_BRANCH" \
              && { ok=1; break; }
            git rebase --abort 2>/dev/null || true
            echo "push 재시도 $i/5"
            sleep $((RANDOM % 5 + 3))
          done
          [ "$ok" = "1" ] || { echo "::error::이미지 푸시 실패"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "발행에 사용할 SHA: $(git rev-parse HEAD)"

      - name: 인스타그램 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          cd scripts
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python publish.py --slug "${{ steps.pick.outputs.slug }}" --dry-run
          else
            python publish.py --slug "${{ steps.pick.outputs.slug }}"
          fi

      - name: 발행 기록 커밋
        if: ${{ inputs.dry_run != true }}
        run: |
          git add state.json
          if git diff --cached --quiet; then
            echo "::warning::state.json 변경이 없습니다. 발행 기록을 확인하세요."
            exit 0
          fi
          git commit -m "posted: ${{ steps.pick.outputs.slug }}"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin "$MAIN_BRANCH" \
              && git rebase "origin/$MAIN_BRANCH" \
              && git push origin "HEAD:$MAIN_BRANCH" \
              && { ok=1; break; }
            git rebase --abort 2>/dev/null || true
            echo "push 재시도 $i/5"
            sleep $((RANDOM % 5 + 3))
          done
          [ "$ok" = "1" ] || {
            echo "::error::인스타 발행은 됐지만 state.json 푸시에 실패했습니다. 수동으로 state.json 을 커밋하지 않으면 내일 같은 원고가 다시 올라갑니다."
            exit 1
          }

      - name: 남은 원고 확인
        if: ${{ inputs.dry_run != true }}
        run: |
          cd scripts
          LEFT=$(python -c "import postqueue; print(postqueue.remaining())")
          echo "남은 원고: $LEFT편"
          if [ "$LEFT" -le 7 ]; then
            echo "::warning::원고가 $LEFT편 남았습니다. 곧 채워주세요."
          fi